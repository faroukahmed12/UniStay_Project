spring.application.name=University Housing Management System

server.port=8081

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/unistay
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.properties.hibernate.format_sql=true

#spring.output.ansi.enabled=ALWAYS


# JWT SECRET
jwt.SECRET_KEY=${APP_JWT_SECRET:915d9adf172e7dbcafdf0854e05054e32c0ea67f13f320cc45ce023693206dfc}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory
app.upload.dir=uploads/housing-docs

spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(---){faint} %clr([%thread]){magenta} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %msg%n
